name: Feature or improvement
description: Suggest an idea to improve the website.
title: '[Idea]: '
labels: [enhancement]
body:
  - type: textarea
    id: idea
    attributes:
      label: What would you improve?
      description: Describe your idea and why it would be useful.
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: Anything else? (optional)
      description: Add examples, screenshots or links if helpful.
